        text: |
          🤔 <b>Несколько направлений или нестандартная ситуация</b>

          Это значит, что Вам нужен комплексный разбор - структура, налоги, банкинг, ВНЖ под одну стратегию. Такие кейсы мы ведём индивидуально.

          Что предложим:
          • 60-минутная стратегическая сессия с партнёром THE A
          • Карта Вашей текущей ситуации + 2-3 сценария оптимизации
          • Расчёт экономии налогов по каждому сценарию
          • Дорожная карта со сроками и стоимостью реализации

          Стоимость стратегической сессии: персонально. С промокодом <code>HAYAT15</code> - -15%.

          Что дальше?
bingo:
  # «Бізнес-бінго» (I AM. IN, 11.11.2026).
  # Гість: ім'я та прізвище → 9 питань (кнопки) → після «так» розгорнута відповідь → фінальне питання.
  button: "🎯 Бізнес-бінго"
  intro: |
    <b>🎯 Бізнес-бінго · I AM. IN</b>

    9 питань з картки + одне фінальне. Після відповіді можна розповісти свою історію - найкращі історії отримають подарунки від THE A 🎁
    Переможців оголосимо зі сцени 🎤
  ask_name: "Як вас звати? Напишіть, будь ласка, <b>ім'я та прізвище</b> - саме так ми оголосимо переможців 👇"
  yes_button: "✅ Чисто про мене"
  no_button: "❌ Не розумію, про що ви"
  question_header: "<b>Питання {n} з {total}</b>"
  # {prompt} - навідне питання конкретного питання (prompt нижче), або default_prompt.
  default_prompt: "Розкажіть детальніше, як це було 👇"
  story_prompt: |
    {prompt}

    Найкращі історії отримають подарунки від THE A 🎁
  skip_button: "Пропустити ➡️"
  # story: true - після «✅» бот просить розгорнуту історію (prompt - навідне питання); за кожне таке питання
  # Ксенія/модератор дарує ОДИН подарунок (мат або сумку). Решта матів і сумок - у фінальний розіграш.
  questions:
  - text: Банк просив «ще один документик»
    story: true
    prompt: Який банк і що саме просили? Скільки «ще одних документиків» було в підсумку? 😅
  - text: Рахунок відкривав довше, ніж компанію
    story: true
    prompt: У якій країні була компанія? Скільки пішло на реєстрацію і скільки - на рахунок? Що найбільше затягнуло?
  - text: Маю компанію в країні, де не живу
    story: true
    prompt: Розкажіть, де ви живете і чому компанія саме в цій країні?
  - text: Підписував документи, не дочитавши
    story: true
    prompt: Що це був за документ і що з'ясувалось, коли ви його все ж дочитали? 🙈
  - text: У мене більше юросіб, ніж домашніх тварин
    story: true
    prompt: Скільки у вас юросіб і в яких країнах? А домашніх тварин? 🐾
  - text: Переказ грошей між країнами - це був квест
    story: true
    prompt: Звідки і куди був переказ і що пішло не так? Скільки днів ішли гроші?
  - text: Знаю, що таке KYC, і хотів би це забути
    story: false
  - text: Інвойс у євро - а гроші в крипті
    story: true
    prompt: Як ви отримуєте оплату і переводите її в крипту? Що найскладніше - банк, податки чи бухгалтерія?
  - text: Не пам'ятаю всі паролі від бізнес-акаунтів
    story: false
  final_question: "🏁 <b>Фінальне питання</b>\n\nЯк звали вашого улюбленця? 🐾"
  done: "Дякуємо, {name}! 🙌 Ви в грі. Переможців оголосимо зі сцени 🎤"
  already_done: "Ви вже пройшли бінго, {name} 🙌 Чекайте оголошення переможців зі сцени 🎤"
  # Подарунки. pool: draw - розіграш серед усіх учасників (і подарунки «від себе»),
  #                 best - за найкращі історії (по одному на питання зі story: true),
  #                 final - фінальний розіграш серед тих, хто відповів на останнє питання
  #                         (туди ж ідуть залишки з best).
  prizes:
  - id: cap_dark
    label: Кепка темна
    qty: 3
    pool: draw
  - id: cap_light
    label: Кепка світла
    qty: 3
    pool: draw
  - id: tshirt
    label: Футболка
    qty: 4
    pool: draw
  - id: yoga_mat
    label: Мат для йоги
    qty: 5
    pool: best
  - id: sport_bag
    label: Спортивна сумка
    qty: 5
    pool: best
  - id: audit
    label: Структурний аудит бізнесу від THE A
    qty: 1
    pool: final
