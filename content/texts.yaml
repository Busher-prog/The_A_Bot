        label: Квартира в Турции
        text: |
          🏠 <b>Квартира в Турции - что входит в наш пакет</b>

          После покупки квартиры в Турции 20-летняя льгота 0% <b>не применяется автоматически</b>. Нужно пройти 6 формальных шагов оформления налогового резидентства. Пропуск одного - vergi ziyaı и потеря льготы.

          Наш пакет «ВНЖ + налоговое резидентство Турции»:
          • 6 шагов оформления налогового резидентства
          • Активация льготы 20 лет 0% на зарубежный доход
          • Получение ВНЖ для основного заявителя и семьи
          • Открытие банковского счёта в Турции
