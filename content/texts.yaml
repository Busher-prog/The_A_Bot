# ---------------------------------------------------------------------------
# Усі тексти бота. Редагуйте тут — код чіпати не потрібно.
#
# Форматування: Telegram HTML — <b>жирний</b>, <i>курсив</i>, <a href="...">посилання</a>.
# Символи < > & у звичайному тексті пишіть як &lt; &gt; &amp;
# ---------------------------------------------------------------------------

# Стартові екрани. «default» показується за звичайним /start.
# Інші — за посиланням t.me/BusinessManagerTheA_bot?start=<назва>, наприклад з QR-коду.
# buttons: photos (фото), consult (консультація) або id теми з розділу topics.
#          Щоб змінити напис кнопки лише на цьому екрані: {id: other, label: "..."}
start_screens:
  default:
    text: |
      Вітаю! Я - бот The A, міжнародної юридично-фінансової консалтингової групи.

      Допоможу розібратися у питаннях:
      • Реєстрації компаній у 50+ юрисдикціях
      • Відкриття банківських рахунків, зокрема для нерезидентів
      • Посвідок на проживання та податкового резидентства
      • Податкового планування та ліцензування бізнесу
      • Криптоактивів та OTC-операцій, зокрема підтвердження походження коштів

      Опишіть коротко своє завдання прямо тут - і профільний спеціаліст The A підкаже можливі рішення.

      Робочі години: 10:00–22:00 CET. Перша відповідь - протягом 15 хвилин.
    buttons: [photos, banks, tax, company, other, consult]

  # QR-код на річниці YBC Lisbon. ПЕРЕВІРИТИ: назва після ?start= у посиланні QR-коду.
  ybc:
    text: |
      Вітаємо на річниці YBC Lisbon! 👋

      <b>THE A</b> - генеральний партнер: податки, компанії, банки, 50+ юрисдикцій.

      Що актуально для вас?
    buttons:
      - photos
      - banks
      - tax
      - company
      - consult
      - {id: other, label: "🤔 Інше"}

buttons:
  write_manager: "✍️ Написати менеджеру"
  back: "⬅️ Повернутись до тем"
  cancel: "Скасувати"

photos:
  button: "📸 Фото з 4-ї річниці YBC Lisbon"
  album_button: "Відкрити фотоальбом"
  album_url: "https://example.com/REPLACE-WITH-ALBUM-LINK"
  text: |
    Саме завдяки вам 4-та річниця YBC Lisbon стала вечором, сповненим щирих емоцій, натхнення та нових знайомств ✨

    Для команди THE A було великою радістю не лише підтримати це свято як генеральний спонсор, а й стати частиною його атмосфери

    Ми підготували фотографії, які допоможуть знову пережити найтепліші миті цього вечора

    Знаходьте себе, діліться світлинами та зберігайте ці спогади! 📸

# Теми. Щоб додати нову — скопіюйте блок і дайте йому унікальний id (латиницею).
topics:
  - id: banks
    button: "🏦 Банки і рахунки"
    text: |
      <b>🏦 Банки і рахунки</b>

      Відкриття рахунків для компаній і приватних осіб, підбір банку чи платіжної системи під ваш профіль, супровід комплаєнсу.

      Якщо рахунок заблокували або банк просить документи - готуємо пакет пояснень у тому вигляді, в якому його очікує комплаєнс.

      Напишіть коротко про вашу ситуацію - менеджер THE A відповість особисто.

  - id: tax
    button: "📊 Податки і резидентство"
    text: |
      <b>📊 Податки і резидентство</b>

      Визначення та зміна податкового резидентства, декларування, подвійне оподаткування, спеціальні режими для новоприбулих (Португалія IFICI, Кіпр non-dom та інші).

      Для отримання персонального розбору вкажіть країну вашого поточного перебування та характер отриманого доходу.

  - id: company
    button: "🏢 Компанія за кордоном"
    text: |
      <b>🏢 Компанія за кордоном</b>

      Реєстрація компаній у 50+ юрисдикціях з урахуванням банківської перспективи: щоб після реєстрації вдалося відкрити рахунок.

      Напишіть, чим займаєтесь і в яких країнах клієнти - запропонуємо варіанти.

  - id: other
    button: "🤔 Інше питання"
    text: |
      <b>🤔 Розкажіть про вашу ситуацію</b>

      Опишіть коротко своїми словами: у якій ви країні, чим займаєтесь, що саме турбує. Менеджер THE A прочитає і відповість особисто.

# Запис на консультацію. ЧЕРНЕТКА — замініть тексти, коли будуть готові.
consultation:
  button: "📅 Записатися на консультацію"
  ask_name: "Чудово! Як до вас звертатися?"
  ask_contact: |
    Дякуємо, {name}! Поділіться, будь ласка, контактом кнопкою нижче або напишіть номер телефону / нік у Telegram.
  share_contact_button: "📱 Поділитися контактом"
  ask_question: "Коротко: яке питання хочете обговорити на консультації?"
  done: "Дякуємо! Заявку отримано, менеджер THE A зв'яжеться з вами найближчим часом 🙌"
  cancelled: "Добре, скасовано."

manager:
  # Після натискання «Написати менеджеру»
  prompt: "Напишіть ваше питання одним повідомленням - менеджер THE A відповість особисто."
  # Коли клієнт надіслав повідомлення
  sent: "Дякуємо! Повідомлення передано менеджеру THE A. Перша відповідь - протягом 15 хвилин (10:00–22:00 CET)."

# Опис бота в профілі Telegram.
# description — екран «What can this bot do?», який людина бачить до натискання «Старт» (до 512 символів).
# short_description — короткий опис у профілі бота та при пересиланні посилання (до 120 символів).
profile:
  description: |
    Бот The A - міжнародної юридично-фінансової консалтингової групи.

    Підкажу з:
    • реєстрацією компаній у 50+ юрисдикціях
    • банківськими рахунками, зокрема для нерезидентів
    • посвідками на проживання і податковим резидентством
    • податковим плануванням і ліцензуванням
    • OTC та легалізацією криптоактивів

    Натисніть «Старт» - опишіть завдання, підключимо профільного спеціаліста The A.
  short_description: "International legal & financial structures. Companies, banks, residency, tax — 50+ jurisdictions."

# Меню команд (кнопка «Меню» біля поля вводу)
commands:
  start: "Головне меню"
  consult: "Записатися на консультацію"
