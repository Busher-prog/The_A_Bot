          • Юридическая поддержка 12 месяцев после получения статуса

          Сроки: 4-6 недель.
          Стоимость: персонально под ситуацию. С промокодом <code>HAYAT15</code> - -15% к итогу.

          Что дальше?
      foreign:
        label: Зарубежный доход → 0% на 20 лет
        text: |
          💼 <b>Зарубежный доход → 0% на 20 лет</b>

          20-летняя льгота (Закон №7582, статья 20/D) применяется только если Вы становитесь налоговым резидентом Турции по правилам. ВНЖ ≠ налоговое резидентство, на этой развилке мы видим большинство ошибок.

          Что мы делаем:
          • Анализируем Вашу текущую налоговую ситуацию (страна + структура дохода)
          • Считаем эффект перехода: сколько Вы сэкономите за 20 лет
          • Готовим план получения налогового резидентства Турции
          • Сопровождаем exit-tax из текущей юрисдикции (если применим)
          • Открываем банковский счёт + ставим на налоговый учёт в Турции
          • 12 месяцев поддержки после получения статуса

          Срок: 6-10 недель в зависимости от текущей юрисдикции.
          Стоимость: персонально. Промокод <code>HAYAT15</code> = -15% на юридическое сопровождение.

          Что дальше?
      amnesty:
        label: Vereturn капитала через Varlık Barışı
        text: |
          💰 <b>Varlık Barışı - возврат капитала</b>

          8-я программа амнистии капитала Турции. Окно - до <b>31 июля 2027</b>. Декларируете активы за рубежом - налог 0-5% в зависимости от срока хранения. Главная сложность не в декларации, а в том, чтобы турецкий банк <b>принял Source of Funds</b>.

          У нас два продукта под этот сегмент:

          <b>1. Юридическое сопровождение Varlık Barışı</b>
          Подготовка декларации, согласование с налоговой, юридический пакет под банк. Скидка по промокоду <code>HAYAT15</code> = -15%.

          <b>2. Финансовая релокация капитала</b>
          Подбор юрисдикций отправки, маршруты USDT / USD / EUR / CHF, compliance со стороны принимающего банка. Скидки на финансовые услуги не действуют, но команда подберёт оптимальное решение под Ваш объём и историю активов.

          Сроки: 3-6 недель для подготовки + 1-3 месяца для исполнения банковской части.

          Что дальше?
