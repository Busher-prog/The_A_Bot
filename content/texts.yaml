commands_text:
  services: |
    Что мы делаем:

    - Регистрация компаний в 50+ юрисдикциях
    - Открытие банковских счетов, в том числе для нерезидентов и сложных профилей
    - ВНЖ и налоговое резидентство (Португалия NHR 2.0 / IFICI, Cyprus non-dom, UAE Golden Visa и др.)
    - Налоговое планирование и холдинговые структуры
    - Лицензирование: gambling, finance, defense, VASP/crypto
    - OTC, легализация криптовалюты, инвестиционные договоры
    - Cash-to-cash, USDT-обмен, работа с платёжными системами

