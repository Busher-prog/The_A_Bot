# ---------------------------------------------------------------------------
# Усі тексти та кнопки бота. Редагуйте тут — код чіпати не потрібно.
#
# Форматування: Telegram HTML — <b>жирний</b>, <i>курсив</i>, <code>код</code>,
# <a href="...">посилання</a>. Символи < > & у звичайному тексті: &lt; &gt; &amp;
#
# screens — стартові екрани. "direct" — звичайний /start. Інші відкриваються
#   посиланням t.me/BusinessManagerTheA_bot?start=<start_param> (QR-коди).
#   buttons: photos, consult, calc, form_<форма>, seg_<тема з group>.
#   label у кнопці можна не вказувати — візьметься стандартний.
# groups — набори тем (seg_...) і кнопки під кожною темою:
#   discuss (написати менеджеру), menu (назад), form_<форма>.
# forms — анкети (консультація, Hayat). Відповіді йдуть менеджеру і в журнал.
# ---------------------------------------------------------------------------

