        text: |
          🇪🇸 <b>Іспанія: резидентство і декларування</b>

          Іспанія визначає податкове резидентство за фактами, а не за наявністю картки. Достатньо однієї умови з трьох: понад 183 дні на рік у країні, тут центр ваших економічних інтересів, або тут постійно живе сім'я.

          Якщо ви резидент - декларується світовий дохід. Окремо існує Modelo 720 (інформативна декларація про закордонні активи, поріг €50 000 по кожній із трьох категорій, строк - до 31 березня).

          Щоб зрозуміти вашу ситуацію, потрібно порахувати дні, склад доходів і активів.

          Напишіть коротко про свій випадок - менеджер THE A відповість особисто.
      fop:
        label: ФОП в Україні + життя за кордоном
        text: |
          💼 <b>ФОП в Україні + життя за кордоном</b>

          Найчастіша ситуація: ФОП зареєстрований в Україні, а людина живе в ЄС. Податок прив'язаний не до місця реєстрації, а до того, де ви податковий резидент.

          Ключовий нюанс: сплачений в Україні єдиний податок зараховують за кордоном не завжди - це залежить від конкретної країни та чинної конвенції. З Іспанією, наприклад, досі застосовується договір 1985 року.

          Варіанти зазвичай три: залишити ФОП і коректно відзвітувати, оформити місцевий статус підприємця, або побудувати структуру. Вибір - питання розрахунку.

          Для отримання персонального розбору вкажіть країну вашого поточного перебування та характер отриманого доходу.
      bank:
        label: Банк заблокував рахунок або просить документи
        text: |
          🏦 <b>Банк заблокував рахунок або просить документи</b>

          Найчастіше це запит на підтвердження походження коштів (source of funds) або уточнення щодо конкретної операції. Головне - не ігнорувати строк відповіді й не надсилати документи хаотично.

          Ми готуємо пакет пояснень і документів у тому вигляді, в якому його очікує комплаєнс, і супроводжуємо листування з банком.

          Опишіть коротко: який банк, що саме запитує і чи є строк - подивимось, що можна зробити.
      company:
        label: Компанія або рахунок за кордоном
        text: |
          🏢 <b>Компанія або рахунок за кордоном</b>

          Реєстрація компанії - це половина шляху; друга половина - відкрити для неї рахунок. Банк дивиться на substance, характер операцій і прозорість структури, тому юрисдикцію варто обирати одразу з урахуванням банківської перспективи.

          Працюємо з 50+ юрисдикціями, підбираємо рішення під профіль діяльності.

          Напишіть, чим займаєтесь і в яких країнах клієнти - запропонуємо варіанти.
      other:
